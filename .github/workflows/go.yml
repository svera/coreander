name: Go

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build
        run: go build .

      - name: Test
        run: go test -v ./... --cover

      - name: Test release build environments
        run: go test magefile.go magefile_test.go

      - name: Test Linux release on a CPU without AVX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user
          go run github.com/magefile/mage build linux64
          qemu-x86_64 -cpu qemu64 ./coreander --help

      - name: Test JavaScript
        run: node --test internal/webserver/js-tests/*.test.mjs
