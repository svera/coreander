{{$sortBy := .SortBy}}
{{$lang := .Lang}}
<div class="form-floating">
    <select class="form-select form-select-sm" id="sort-by" name="sort-by"
        onchange="(function(v){var f=document.getElementById('search-filters-form');if(f&&f._coreanderApplyFilters){f._coreanderApplyFilters()}else{window.location.href='{{.SortURL}}sort-by='+v}})(this.value)">
        {{range $option := .AdditionalSortOptions}}
        <option value="{{$option.Key}}" {{if eq $sortBy $option.Key}}selected{{end}}>{{if eq $option.Key "review-score-asc"}}{{if $.ReviewSourceName}}{{t $lang "%s score (ascending)" $.ReviewSourceName}}{{else}}{{t $lang "Review score (ascending)"}}{{end}}{{else if eq $option.Key "review-score-desc"}}{{if $.ReviewSourceName}}{{t $lang "%s score (descending)" $.ReviewSourceName}}{{else}}{{t $lang "Review score (descending)"}}{{end}}{{else}}{{t $lang $option.Value}}{{end}}</option>
        {{end}}
    </select>
    <label for="sort-by">{{t $lang "Sort by"}}</label>
</div>
