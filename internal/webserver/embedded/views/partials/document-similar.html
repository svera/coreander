{{ $length := len .SimilarDocuments }} {{ if gt $length 0 }}
<section class="row gx-2 mt-5">
    <div class="col-12">
        <h2><a href="/documents/{{.DocumentSlug}}/similar">{{t .Lang "Similar documents"}}</a> ({{.SimilarDocumentsTotal}})</h2>
    </div>

    {{range $i, $doc := .SimilarDocuments}}
    <div class="col-6 col-lg-3 mt-3 align-self-end">
        {{template "partials/cover" dict "Lang" $.Lang "Document" $doc "Session" $.Session "FixedAspectRatio" true}}
    </div>
    {{end}}
</section>
{{end}}
