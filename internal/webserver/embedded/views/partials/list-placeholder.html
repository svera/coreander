{{$version := .Version}}
{{$isAuthors := eq .SearchType "authors"}}
<div id="placeholder-indicator" class="list-group-placeholder htmx-indicator w-100 list-group list-group-flush" aria-hidden="true">
    {{if .Results}} {{range $i, $result := .Results.Hits}}
    <div class="list-group-item placeholder-glow mt-5">
        <div class="placeholder-skeleton-doc row mb-5{{if $isAuthors}} d-none{{end}}">
            <div class="col-12 col-md-4 col-lg-3">
                <div class="card border border-0">
                    <img src="/images/generic.webp{{versionParam $version}}" class="cover img-fluid" />
                </div>
            </div>
            <div class="col-12 col-md-8 col-lg-9">
                <div class="row">
                    <div class="col-7">
                        <span class="mb-0 placeholder col-12"></span>
                        <h4><span class="placeholder col-12"></span></h4>
                        <span class="small placeholder col-2"></span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <h5><span class="placeholder col-4"></span></h5>
                        <p><span class="placeholder col-6"></span></p>
                        <div>
                            <span class="placeholder col-2"></span>
                            <span class="placeholder col-2"></span>
                            <span class="placeholder col-2"></span>
                        </div>
                        <div class="mb-1 mt-3">
                            <span class="placeholder col-12"></span>
                            <span class="placeholder col-12"></span>
                            <span class="placeholder col-12"></span>
                            <span class="placeholder col-12"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="placeholder-skeleton-author row mb-5{{if not $isAuthors}} d-none{{end}}">
            <div class="col-12 col-md-4 col-lg-3 mb-3">
                <div class="ratio ratio-1x1">
                    <span class="placeholder w-100 rounded-circle"></span>
                </div>
            </div>
            <div class="col-12 col-md-8 col-lg-9">
                <h2><span class="placeholder col-6"></span></h2>
                <p><span class="placeholder col-10"></span></p>
                <span class="placeholder col-3"></span>
            </div>
        </div>
    </div>
    {{end}} {{end}}
</div>
