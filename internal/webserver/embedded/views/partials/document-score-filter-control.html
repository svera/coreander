{{$id := .Name}}
{{if .IdPrefix}}
    {{$id = printf "%s-%s" .IdPrefix .Name}}
{{end}}
<div class="form-floating">
    <select class="form-select{{if .RoundedEnd}} rounded-end{{end}}" name="{{.Name}}" id="{{$id}}">
        <option value="" {{if eq .Score .Default}}selected{{end}}></option>
        <option value="0" {{if and (eq .Score 0.0) (ne .Score .Default)}}selected{{end}}>{{t .Lang "No score"}}</option>
        <option value="1" {{if eq .Score 1.0}}selected{{end}}>1 &#9733;</option>
        <option value="2" {{if eq .Score 2.0}}selected{{end}}>2 &#9733;&#9733;</option>
        <option value="3" {{if eq .Score 3.0}}selected{{end}}>3 &#9733;&#9733;&#9733;</option>
        <option value="4" {{if eq .Score 4.0}}selected{{end}}>4 &#9733;&#9733;&#9733;&#9733;</option>
        <option value="5" {{if and (eq .Score 5.0) (ne .Score .Default)}}selected{{end}}>5 &#9733;&#9733;&#9733;&#9733;&#9733;</option>
    </select>
    <label class="form-label" for="{{$id}}">{{t .Lang .Label}}</label>
</div>
