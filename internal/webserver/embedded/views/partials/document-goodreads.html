<li><i class="bi bi-star-fill me-2" alt="{{t .Lang "Goodreads rating"}}" title="{{t .Lang "Goodreads rating"}}"></i>{{if .Rating}}<a href="{{.URL}}" class="fw-bold text-decoration-none" target="_blank" rel="noopener noreferrer" title="{{t .Lang "Goodreads rating"}}">{{.Rating}}</a>{{if .RatingCount}} <small>({{t .Lang "%s ratings" .RatingCount}})</small>{{end}}{{else}}<span class="text-body-secondary">{{t .Lang "No score"}}</span>{{end}}</li>
